name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Check signature and requested permissions
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -E 'READ_CONTACTS|ACCESS_FINE_LOCATION|READ_SMS|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE' permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Melody-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
